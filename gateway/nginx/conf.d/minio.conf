location = /minio {
  return 301 /minio/;
}

location /minio/ {
  proxy_pass http://minio:9001/;
  proxy_set_header Accept-Encoding "";
  sub_filter_once on;
  sub_filter_types text/html;
  sub_filter '<base href="/"/>' '<base href="/minio/"/>';
  include /etc/nginx/snippets/proxy.conf;
}

location /media/ {
  proxy_pass http://minio:9000/media/;
  include /etc/nginx/snippets/proxy.conf;
}
