<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f7fb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 30px 10px;">
        <tr>
            <td align="center">

                <!-- Container -->
                <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; background:#ffffff; border-radius:8px; border:1px solid #e5e7eb; overflow:hidden;">

                    <!-- Header -->
                    <tr>
                        <td style="background:#000; padding:24px; text-align:center;">
                            <h1 style="margin:0; font-size:22px; color:#ffffff; font-weight:600;">
                                {{ title }}
                            </h1>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding:28px; color:#374151; font-size:15px; line-height:1.6;">

                            <p style="margin:0 0 16px 0;">
                                Hi {{ name if name else 'there' }},
                            </p>

                            <p style="margin:0 0 20px 0;">
                                {{ message }}
                            </p>

                            <p style="margin:20px 0 8px 0; font-weight:500; color:#111827;">
                                Your One-Time Password (OTP):
                            </p>

                            <!-- OTP Box -->
                            <div style="
                                display:inline-block;
                                margin:12px 0 18px 0;
                                padding:14px 28px;
                                background:#f1f3ff;
                                border:1px solid #dfe3ff;
                                color:#000000;
                                font-size:28px;
                                font-weight:700;
                                border-radius:6px;
                                letter-spacing:3px;
                            ">
                                {{ otp }}
                            </div>

                            <p style="margin:0; font-size:13px; color:#6b7280;">
                                This OTP will expire in <strong>{{ expires_in }} minutes</strong>.
                                Please do not share it with anyone.
                            </p>

                            <p style="margin-top:28px;">
                                Thanks,<br>
                                <strong>OCReel Team</strong>
                            </p>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background:#f9fafb; text-align:center; padding:16px; font-size:12px; color:#9ca3af; border-top:1px solid #e5e7eb;">
                            © 2026 BEAM. All rights reserved.<br><br>
                            <a href="#" style="color:#000; text-decoration:none;">Privacy Policy</a> &nbsp;|&nbsp;
                            <a href="#" style="color:#000; text-decoration:none;">Terms of Service</a>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
